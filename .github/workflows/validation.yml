name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: pip install -r TOOLS/requirements.txt

      - name: Structural, contract and drift checks
        run: python TOOLS/validate_package.py

      - name: Conformance tests (schema conditionals, positive/negative cases)
        run: python TOOLS/conformance_tests.py

      - name: Generated-artifact drift check (--check only, never --regen)
        run: python TOOLS/generate_artifacts.py --check

      - name: Release gate (canonical release-readiness command)
        run: python TOOLS/release_gate.py

  windows-desktop-validation:
    name: Windows Desktop & WPF Solution Validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r TOOLS/requirements.txt

      - name: Validate package and conformance on Windows
        run: |
          python TOOLS/validate_package.py
          python TOOLS/conformance_tests.py
          python TOOLS/release_gate.py

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@3951f3cc7a0a0d198613357f8a27d400bd404643 # v4.3.0
        with:
          dotnet-version: "8.0.x"

      - name: Restore .NET dependencies
        run: dotnet restore AMCCA.sln

      - name: Build .NET solution (Release)
        run: dotnet build AMCCA.sln --no-restore --configuration Release

      - name: Run .NET test suites (Core, Concurrency, Chaos, OAuth, WPF MVVM)
        run: dotnet test AMCCA.sln --no-build --configuration Release --verbosity normal

      - name: Verify AMCCA.exe binary generated and functional
        shell: pwsh
        run: |
          $exePath = "src/AMCCA.App/bin/Release/net8.0-windows/AMCCA.exe"
          if (-not (Test-Path $exePath)) {
            throw "AMCCA.exe not found at $exePath"
          }
          $versionOutput = & $exePath --version
          if ($versionOutput -ne "3.1.0") {
            throw "Expected 3.1.0 but got $versionOutput"
          }
          Write-Host "AMCCA.exe binary verified successfully: $versionOutput"

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.0
          wix extension add WixToolset.BootstrapperApplications.wixext/5.0.0 -g

      - name: Build WiX Installer (AMCCA-Setup.msi and AMCCA-Setup.exe)
        shell: pwsh
        run: |
          & powershell -ExecutionPolicy Bypass -File installer/build_installer.ps1
          if (-not (Test-Path dist/installer/AMCCA-Setup.msi)) {
            throw "dist/installer/AMCCA-Setup.msi not found"
          }
          if (-not (Test-Path dist/installer/AMCCA-Setup.exe)) {
            throw "dist/installer/AMCCA-Setup.exe not found"
          }
          Write-Host "WiX Installer verified successfully."

      - name: Run Deterministic Release Certification Pipeline
        shell: pwsh
        run: |
          & powershell -ExecutionPolicy Bypass -File TOOLS/release_certification.ps1
          Write-Host "Release certification completed successfully."
